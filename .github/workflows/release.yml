name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate tag and metadata version
        shell: powershell
        run: |
          $version = (Get-Content chatterino-plugin/info.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match plugin version $version."
          }
      - run: go test ./...
      - run: go vet ./...
      - run: .\scripts\package.ps1
      - name: Create checksum
        shell: pwsh
        run: |
          $zip = "dist/chatterino-multichat-overlay-windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  chatterino-multichat-overlay-windows-x64.zip" | Set-Content "$zip.sha256"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "chatterino-multichat-overlay $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes-file docs/release-notes.md `
            "dist/chatterino-multichat-overlay-windows-x64.zip" `
            "dist/chatterino-multichat-overlay-windows-x64.zip.sha256"
