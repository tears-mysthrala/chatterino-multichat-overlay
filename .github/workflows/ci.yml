name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: .\scripts\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: chatterino-multichat-overlay-windows-x64
          path: dist/chatterino-multichat-overlay-windows-x64.zip
