name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/bridge_test.lua
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - shell: powershell
        run: .\scripts\install_test.ps1
      - run: .\scripts\package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: chatterino-multichat-overlay-windows-x64
          path: dist/chatterino-multichat-overlay-windows-x64.zip
